name: Build and Push Docker Image

on:
  push:
    branches:
      - custom/main
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository_owner }}/graphql-engine

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgmp-dev libpq-dev libssl-dev pkg-config \
            zlib1g-dev liblzma-dev libpcre2-dev \
            unixodbc-dev libkrb5-dev build-essential curl

      - name: Setup GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.16.0.0'

      - name: Cache Cabal store
        uses: actions/cache@v4
        with:
          path: ~/.cabal/store
          key: cabal-${{ runner.os }}-ghc-9.14.1-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            cabal-${{ runner.os }}-ghc-9.14.1-

      - name: Set version
        run: echo "v2.49.1" > server/CURRENT_VERSION

      - name: Cabal update
        run: cabal update

      - name: Build graphql-engine
        run: cabal build exe:graphql-engine -j$(nproc)

      - name: Prepare Docker context
        run: |
          mkdir -p /tmp/docker-ctx
          cp $(find dist-newstyle -name "graphql-engine" -type f -executable | head -1) /tmp/docker-ctx/graphql-engine
          chmod +x /tmp/docker-ctx/graphql-engine
          cat > /tmp/docker-ctx/Dockerfile << 'EOF'
          FROM hasura/graphql-engine:v2.49.1
          COPY graphql-engine /bin/graphql-engine
          EOF

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          VERSION=$(cat server/CURRENT_VERSION)
          docker build \
            -t ghcr.io/${{ env.IMAGE_NAME }}:latest \
            -t ghcr.io/${{ env.IMAGE_NAME }}:${VERSION}-jsonb-path \
            /tmp/docker-ctx
          docker push ghcr.io/${{ env.IMAGE_NAME }}:latest
          docker push ghcr.io/${{ env.IMAGE_NAME }}:${VERSION}-jsonb-path

